<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-adsense-account" content="ca-pub-1919515145645580">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1919515145645580"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fishflow</title>
    <meta name="description" content="Dive into FishFlow, an interactive pixel physics sandbox! Build thriving aquatic ecosystems with sand and water, or destroy it all with fire and lava. Play for free!">
    <link rel="icon" type="image/png" href="./assets/logo.png">
    <style>
        body {
            margin: 0; background-color: #e2e8f0; color: #1e293b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: row; 
            height: 100vh; height: 100dvh; overflow: hidden;
            box-sizing: border-box;
        }
        
        /* --- DESKTOP AD SIDEBAR (25% Width) --- */
        #ad-sidebar {
            flex: 0 0 25%; max-width: 25%;
            background-color: #cbd5e1; border-right: 3px solid #94a3b8;
            display: flex; align-items: center; justify-content: center; padding: 10px; box-sizing: border-box;
        }
        
        .ad-banner {
            width: 100%; height: 100%; display: flex;
            align-items: center; justify-content: center; color: #475569; font-weight: bold; font-size: 1.1rem;
            text-align: center;
        }

        /* --- DESKTOP MAIN GAME AREA (75% Width) --- */
        #main-area {
            flex: 0 0 75%; max-width: 75%;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            height: 100%; padding-top: 5px; box-sizing: border-box;
        }
        
        #canvas-container {
            width: 100%; 
            flex: 1 1 0; min-height: 0; min-width: 0; 
            display: flex; align-items: center; justify-content: center; 
            padding: 5px 10px; box-sizing: border-box; 
        }
        
        canvas {
            background-color: #f1f5f9; border: 4px solid #94a3b8; border-radius: 8px; cursor: none; 
            box-shadow: 0px 10px 25px rgba(0,0,0,0.1); touch-action: none; 
            width: 100%; height: auto; max-height: 100%; 
            aspect-ratio: 800 / 550;
            object-fit: contain; 
            image-rendering: pixelated; image-rendering: crisp-edges;
        }
        
        #temp-controls {
            display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center;
            width: 100%; padding: 10px 15px; box-sizing: border-box; flex: 0 0 auto;
        }
        
        button { 
            padding: 8px 14px; font-weight: 600; cursor: pointer; border: 2px solid transparent;
            border-radius: 5px; transition: 0.15s ease-in-out; font-size: 13px; outline: none; touch-action: manipulation; 
        }
        
        button:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        
        .active-element {
            border: 2px solid white !important; box-shadow: 0 0 10px rgba(255, 255, 255, 0.8) !important;
            transform: scale(1.1) !important; z-index: 10;
        }
        
        .brush-controls {
            display: flex; align-items: center; gap: 6px; margin-right: 5px; background: #ffffff;
            padding: 4px 12px; border-radius: 6px; border: 2px solid #cbd5e1; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .btn-size { background-color: #f1f5f9; color: #475569; border-color: transparent; padding: 6px 10px;}
        .btn-size.active { background-color: #3b82f6; color: white; border-color: #2563eb; }
        .btn-reset { background-color: #b91c1c; color: white; margin-right: 5px; }
        .btn-empty { background-color: #f8fafc; color: #334155; border: 2px solid #cbd5e1;}
        .btn-wall { background-color: #64748b; color: white; } 
        .btn-sand { background-color: #d4b483; color: #4a3c22; } 
        .btn-water { background-color: #0284c7; color: white; } 
        .btn-ice { background-color: #bae6fd; color: #0c4a6e; } 
        .btn-seed { background-color: #a3b18a; color: #283618; } 
        .btn-plant { background-color: #166534; color: white; } 
        .btn-fish { background-color: #d97706; color: white; } 
        .btn-mite { background-color: #701a75; color: white; } 
        .btn-gas { background-color: #84cc16; color: #3f6212; } 
        .btn-oil { background-color: #171717; color: white; } 
        .btn-lava { background-color: #dc2626; color: white; } 
        .btn-fire { background-color: #ea580c; color: white; }

        .privacy-footer {
            flex: 0 0 auto; width: 100%; text-align: center; padding-bottom: 5px;
        }
        .privacy-footer a {
            font-size: 11px; color: #64748b; text-decoration: none; opacity: 0.5;
        }
        
        /* ------------------------------------------------------------- */
        /* --- MOBILE TIGHT STACK (Canvas -> Buttons -> Ad -> Privacy) --- */
        /* ------------------------------------------------------------- */
        @media (max-width: 768px) { 
            body { 
                flex-direction: column; 
                height: auto; 
                min-height: 100vh;
                overflow-y: auto; /* Restores natural scrolling for mobile */
            }
            
            #main-area { 
                display: contents; /* Magic trick: Flattens the layout so elements stack perfectly in order */
            }
            
            /* 1. Canvas at the absolute top */
            #canvas-container { 
                order: 1; 
                width: 100%; 
                flex: 0 0 auto; 
                padding: 5px; box-sizing: border-box;
            }
            
            canvas {
                width: 100%; 
                height: auto; 
                max-height: none; /* Guarantees the canvas spans 100% of the screen width */
            }
            
            /* 2. Buttons directly underneath the canvas */
            #temp-controls { 
                order: 2; 
                width: 100%;
                flex: 0 0 auto; 
                display: grid; 
                grid-template-columns: repeat(3, 1fr); 
                gap: 5px; 
                padding: 5px 10px;
                max-height: none; 
            }
            
            /* 3. Ad Banner directly underneath the buttons */
            #ad-sidebar { 
                order: 3; 
                width: 100%; 
                max-width: 100%;
                flex: 0 0 auto; 
                height: auto; 
                min-height: 55px; /* Exact height for AdSense mobile banner */
                border-right: none; 
                border-top: 2px solid #94a3b8; 
                padding: 5px; 
                background-color: transparent; /* Makes the banner area blend perfectly */
            }
            
            /* 4. Privacy Policy pushed to the very bottom */
            .privacy-footer { 
                order: 4; 
                flex: 0 0 auto; 
                margin-top: auto; /* Pushes the link to the bottom edge, swallowing any leftover empty space */
                padding: 15px 0;
            }
            
            .brush-controls { grid-column: 1 / -1; justify-content: center; margin: 0 0 4px 0; }
            .btn-reset { grid-column: 1 / -1; margin: 0 0 4px 0; }
            
            button { 
                width: 100%; margin: 0;
                padding: clamp(6px, 1.5vh, 10px) 2px; 
                font-size: clamp(10px, 3.5vw, 13px);
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>
    
    <div id="ad-sidebar">
        <div class="ad-banner">
            <!-- Google AdSense Display Unit -->
            <ins class="adsbygoogle"
                 style="display:block; width: 100%; height: 100%;"
                 data-ad-client="ca-pub-1919515145645580"
                 data-ad-slot="8510900975" 
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>
    </div>
    
    <div id="main-area">
        
        <div id="canvas-container"><canvas id="gameCanvas" width="800" height="550"></canvas></div>
        
        <div id="temp-controls">
            <div class="brush-controls">
                <span style="font-weight: bold; color: #64748b; margin-right: 5px;">Size:</span>
                <button class="btn-size" onclick="window.setBrush(window.scaleVal(8), this)">S</button>
                <button class="btn-size active" onclick="window.setBrush(window.scaleVal(10), this)">M</button>
                <button class="btn-size" onclick="window.setBrush(window.scaleVal(13), this)">L</button>
            </div>
            <button class="btn-reset" onclick="window.resetGrid()">Reset</button>

            <button class="element-btn btn-empty" onclick="window.selectElement(0, this)">Empty</button>
            <button class="element-btn btn-wall" onclick="window.selectElement(13, this)">Wall</button>
            <button class="element-btn btn-sand active-element" onclick="window.selectElement(4, this)">Sand</button>
            <button class="element-btn btn-water" onclick="window.selectElement(3, this)">Water</button>
            <button class="element-btn btn-ice" onclick="window.selectElement(14, this)">Ice cubes</button>
            <button class="element-btn btn-fire" onclick="window.selectElement(9, this)">Fire</button>
            <button class="element-btn btn-seed" onclick="window.selectElement(8, this)">Seed</button>
            <button class="element-btn btn-mite" onclick="window.selectElement(6, this)">Mite</button>
            <button class="element-btn btn-fish" onclick="window.selectElement(5, this)">Fish</button>
            <button class="element-btn btn-gas" onclick="window.selectElement(12, this)">Gas</button>
            <button class="element-btn btn-oil" onclick="window.selectElement(10, this)">Oil</button>
            <button class="element-btn btn-lava" onclick="window.selectElement(11, this)">Lava</button>
        </div>
        
        <div class="privacy-footer">
            <a href="/privacy.html">Privacy Policy</a>
        </div>
        
    </div>
    
    <script type="module" src="./js/main.js"></script>
</body>
</html>
